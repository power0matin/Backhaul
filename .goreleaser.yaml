version: 2
project_name: backhaul

builds:
  - id: backhaul
    main: ./main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: git

# Keep release notes written in GitHub while making artifact publication
# retry-safe. GoReleaser only removes a matching asset after GitHub rejects an
# upload with 422 already_exists, then retries that artifact.
release:
  mode: keep-existing
  replace_existing_artifacts: true
